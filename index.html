<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel Financeiro Doméstico</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --text:#161b22; --muted:#5c6672; --border:#e2e6ec;
  --pos:#1a9e6e; --neg:#e5484d; --accent:#3559e0; --accent2:#8b5cf6;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#11151c; --surface:#171d27; --text:#e8ecf1; --muted:#8b95a3; --border:#262e3a; }
}
:root[data-theme="dark"]{ --bg:#11151c; --surface:#171d27; --text:#e8ecf1; --muted:#8b95a3; --border:#262e3a; }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.4}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
header{margin-bottom:22px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-0.01em}
.sub{color:var(--muted);font-size:.92rem;margin:0}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:18px}
.filters-row{display:flex;flex-wrap:wrap;gap:22px}
.filter-group{flex:1;min-width:230px}
.filter-group h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:transparent;color:var(--text);padding:5px 12px;border-radius:999px;font-size:.82rem;cursor:pointer;user-select:none;transition:.15s}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.kpi .l{font-size:.76rem;color:var(--muted);margin-bottom:6px}
.kpi .v{font-size:1.4rem;font-weight:650;letter-spacing:-0.01em}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.chart-h{position:relative;height:300px}
.chart-h.tall{height:360px}
h2{font-size:1rem;margin:0 0 14px;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Painel Financeiro Doméstico</h1>
  <p class="sub">Filtre por ano e mês para explorar receitas, despesas e a evolução de cada conta</p>
</header>

<div class="panel">
  <div class="filters-row">
    <div class="filter-group">
      <h3>Ano</h3>
      <div class="chips" id="yearChips"></div>
    </div>
    <div class="filter-group" style="flex:2">
      <h3>Mês</h3>
      <div class="chips" id="monthChips"></div>
    </div>
  </div>
</div>

<div class="kpis" id="kpis"></div>

<div class="panel">
  <h2>Saldo mensal (Receita − Despesas)</h2>
  <div class="chart-h"><canvas id="chartSaldo"></canvas></div>
</div>

<div class="grid2">
  <div class="panel">
    <h2>Evolução de cada conta ao longo do tempo</h2>
    <p class="sub" style="margin:-8px 0 12px">Clique numa legenda para ocultar/mostrar a conta</p>
    <div class="chart-h tall"><canvas id="chartContas"></canvas></div>
  </div>
  <div class="panel">
    <h2>Composição das despesas no período</h2>
    <div class="chart-h tall"><canvas id="chartPizza"></canvas></div>
  </div>
</div>

</div>

<script>
const DATA=[
["Janeiro",2022,689,670,284.0,67,129,695,324,601,1150,2858.0,-1107.0],

["Fevereiro",2023,689,670,292.0,66,149,593,269,539,1494,2728.0,-695.0],
["Março",2023,689,670,296.0,70,149,628,278,525,1494,2780.0,-761.0],
["Abril",2023,722,670,196.0,65,149,590,286,568,1494,2678.0,-616.0],
["Maio",2023,722,670,145.0,65,149,606,379,788,1494,2736.0,-454.0],
["Junho",2023,722,670,204.0,71,149,630,349,806,1494,2795.0,-495.0],
["Julho",2023,722,670,188.0,66,149,570,367,794,1494,2732.0,-444.0],
["Agosto",2023,722,670,199.0,64,149,552,275,986,1494,2631.0,-151.0],
["Setembro",2023,722,670,192.0,64,149,595,296,689,1494,2688.0,-505.0],
["Outubro",2023,722,670,163.0,72,149,598,288,872,1494,2662.0,-296.0],

["Dezembro",2023,722,670,310.0,72,149,594,303,697,1250,2820.0,-873.0],

["Fevereiro",2024,722,702,288.0,67,139,548,360,1151,1565,2826.0,-110.0],

["Dezembro",2025,771,712,289.0,72,149,693,768,3925,1502,3454.0,1973.0],
["Janeiro",2026,771,712,311.0,72,149,746,896,3700,1502,3657.0,1545.0],
["Fevereiro",2026,771,712,290.0,64,149,657,1024,3700,1760,3667.0,1793.0],
["Março",2026,771,712,269.0,67,149,670,1152,3700,1760,3790.0,1670.0],
["Abril",2026,379,712,190.0,69,149,1765,1280,3700,1760,4544.0,916.0],
["Maio",2026,571,218,88.3,0,0,1765,1408,3700,1760,4050.3,1409.7],
["Junho",2026,571,218,99.5,33,133,1200,1536,3700,1760,3790.5,1669.5],
["Julho",2026,571,218,99.5,34,108,1300,1664,3700,1760,3994.5,1465.5]
];
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const CONTAS=[
 {i:2,n:"Aluguel",c:"#e5484d",tipo:"despesa"},
 {i:3,n:"Condomínio",c:"#f2994a",tipo:"despesa"},
 {i:4,n:"Luz",c:"#f2c94c",tipo:"despesa"},
 {i:5,n:"Gás",c:"#56ccf2",tipo:"despesa"},
 {i:6,n:"Internet",c:"#3559e0",tipo:"despesa"},
 {i:7,n:"Cartão",c:"#8b5cf6",tipo:"despesa"},
 {i:8,n:"Comida/Lazer",c:"#ec4899",tipo:"despesa"},
 {i:9,n:"Renda",c:"#1a9e6e",tipo:"receita"},
 {i:10,n:"Quintino",c:"#0d9488",tipo:"receita"}
];
const fmt=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const years=[...new Set(DATA.map(r=>r[1]))].sort();
let selYears=new Set(years), selMonths=new Set(MESES);
const yearChips=document.getElementById('yearChips');
years.forEach(y=>{
  const b=document.createElement('button');b.className='chip active';b.textContent=y;
  b.onclick=()=>{const y2=Number(y);if(selYears.has(y2)){selYears.delete(y2);b.classList.remove('active')}else{selYears.add(y2);b.classList.add('active')}render()};
  yearChips.appendChild(b);
});
const monthChips=document.getElementById('monthChips');
MESES.forEach(m=>{
  const b=document.createElement('button');b.className='chip active';b.textContent=m;
  b.onclick=()=>{if(selMonths.has(m)){selMonths.delete(m);b.classList.remove('active')}else{selMonths.add(m);b.classList.add('active')}render()};
  monthChips.appendChild(b);
});

let cSaldo,cContas,cPizza;
function getFiltered(){
  return DATA.filter(r=>selYears.has(r[1])&&selMonths.has(r[0]))
    .sort((a,b)=> a[1]-b[1] || MESES.indexOf(a[0])-MESES.indexOf(b[0]));
}
function render(){
  const f=getFiltered();
  const kpisEl=document.getElementById('kpis');
  if(!f.length){kpisEl.innerHTML='<div class="empty">Nenhum dado para os filtros selecionados</div>';[cSaldo,cContas,cPizza].forEach(c=>c&&c.destroy());return}
  if(typeof Chart==='undefined'){document.querySelectorAll('.chart-h').forEach(el=>el.innerHTML='<div class="empty">Não foi possível carregar a biblioteca de gráficos (Chart.js). Tente recarregar a página.</div>');return}
  const receita=f.reduce((s,r)=>s+r[9]+r[10],0);
  const despesa=f.reduce((s,r)=>s+r[11],0);
  const saldo=receita-despesa;
  const media=saldo/f.length;
  kpisEl.innerHTML=`
    <div class="kpi"><div class="l">Receita total</div><div class="v pos">${fmt(receita)}</div></div>
    <div class="kpi"><div class="l">Despesa total</div><div class="v neg">${fmt(despesa)}</div></div>
    <div class="kpi"><div class="l">Saldo do período</div><div class="v ${saldo>=0?'pos':'neg'}">${fmt(saldo)}</div></div>
    <div class="kpi"><div class="l">Saldo médio/mês</div><div class="v ${media>=0?'pos':'neg'}">${fmt(media)}</div></div>`;

  const labels=f.map(r=>r[0].slice(0,3)+'/'+String(r[1]).slice(2));
  const gridColor=getComputedStyle(document.body).getPropertyValue('color')+'0d';

  cSaldo&&cSaldo.destroy();
  cSaldo=new Chart(document.getElementById('chartSaldo'),{type:'line',
    data:{labels,datasets:[{label:'Saldo',data:f.map(r=>r[12]),borderColor:'#3559e0',backgroundColor:'#3559e022',fill:true,tension:.25,pointRadius:2,
      segment:{borderColor:ctx=>ctx.p1.parsed.y<0?'#e5484d':'#1a9e6e'}}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{y:{ticks:{callback:v=>fmt(v)}},x:{ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:14}}}}});

  cContas&&cContas.destroy();
  cContas=new Chart(document.getElementById('chartContas'),{type:'line',
    data:{labels,datasets:CONTAS.map(ct=>({label:ct.n,data:f.map(r=>r[ct.i]),borderColor:ct.c,backgroundColor:ct.c,tension:.2,pointRadius:0,borderWidth:2}))},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}}},
      scales:{y:{ticks:{callback:v=>fmt(v)}},x:{ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:12}}}}});

  const despAcc=CONTAS.filter(c=>c.tipo==='despesa');
  cPizza&&cPizza.destroy();
  cPizza=new Chart(document.getElementById('chartPizza'),{type:'doughnut',
    data:{labels:despAcc.map(c=>c.n),datasets:[{data:despAcc.map(c=>f.reduce((s,r)=>s+r[c.i],0)),backgroundColor:despAcc.map(c=>c.c)}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}},
      tooltip:{callbacks:{label:ctx=>ctx.label+': '+fmt(ctx.parsed)}}}}});
}
render();
</script>
</body>
</html>
